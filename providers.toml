# Cloudkot Provider Profiles
# Default configurations for common LLM providers

[providers]

[providers.openai]
name = "OpenAI"
description = "OpenAI ChatGPT models"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
models = ["gpt-4o", "gpt-4o-mini", "gpt-3.5-turbo"]
auth_type = "api_key"
requires_oauth = false

[providers.openai_oauth]
name = "OpenAI OAuth"
description = "OpenAI with OAuth (ChatGPT Plus/Pro)"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_OAUTH_TOKEN"
models = ["gpt-4o", "gpt-4o-mini", "gpt-3.5-turbo"]
auth_type = "oauth"
requires_oauth = true
oauth_url = "https://auth.openai.com"

[providers.anthropic]
name = "Anthropic"
description = "Anthropic Claude models"
base_url = "https://api.anthropic.com/v1"
api_key_env = "ANTHROPIC_API_KEY"
models = ["claude-3-5-sonnet-20241022", "claude-3-haiku-20240307", "claude-3-sonnet-20240229"]
auth_type = "api_key"
requires_oauth = false

[providers.mistral]
name = "Mistral AI"
description = "Mistral AI models"
base_url = "https://api.mistral.ai/v1"
api_key_env = "MISTRAL_API_KEY"
models = ["mistral-large", "mistral-small", "mistral-tiny"]
auth_type = "api_key"
requires_oauth = false

[providers.openrouter]
name = "OpenRouter"
description = "OpenRouter API gateway"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
models = ["openai/gpt-4o", "anthropic/claude-3-5-sonnet", "mistralai/mistral-large"]
auth_type = "api_key"
requires_oauth = false

[providers.opencode_go]
name = "OpenCode Go"
description = "OpenCode Go models"
base_url = "https://api.opencode.co/v1"
api_key_env = "OPENCODE_API_KEY"
models = ["openai/gpt-4o", "anthropic/claude-3-5-sonnet"]
auth_type = "api_key"
requires_oauth = false

[providers.opencode_zen]
name = "OpenCode Zen"
description = "OpenCode Zen models"
base_url = "https://api.zen.opencode.co/v1"
api_key_env = "OPENCODE_ZEN_API_KEY"
models = ["openai/gpt-4o", "anthropic/claude-3-5-sonnet"]
auth_type = "api_key"
requires_oauth = false

# Default provider
[default]
provider = "openai"
model = "gpt-4o"
