[tool.poetry]
name = "cloudkot"
version = "0.1.0"
description = "Der deutsche KI-Code-Assistent mit Bürokratie-Modus"
authors = ["Mo K <your.email@example.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
httpx = "^0.25.0"
pydantic = "^2.5.0"
click = "^8.1.7"
pygls = "^1.0.0"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
jinja2 = "^3.1.3"

[tool.poetry.group.dev.dependencies]
black = "^24.1.1"
ruff = "^0.1.14"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
cloudkot = "main:cli"
cloudkot-lsp = "lsp_server:server.start_io"
