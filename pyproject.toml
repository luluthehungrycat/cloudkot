[tool.poetry]
name = "cloudkot"
version = "0.1.0"
description = "Der deutsche KI-Code-Assistent mit Bürokratie-Modus"
authors = ["Mo K <your.email@example.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "cloudkot", from = "." },
    { include = "satire", from = "." },
    { include = "skills", from = "." },
]

[tool.poetry.dependencies]
python = "^3.10"
httpx = "^0.25.0"
pydantic = "^2.5.0"
click = "^8.1.7"
pygls = "^1.0.0"
websockets = "^12.0"
tomli = { version = "^1.2.0", python = "<3.11" }
tiktoken = "^0.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"
black = "^24.1.1"
ruff = "^0.1.14"
mypy = "^1.0.0"
build = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
cloudkot = "main:cli"
cloudkot-tui = "tui:create_tui"
cloudkot-mcp = "mcp_server:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["lsp_server\\.py$"]
